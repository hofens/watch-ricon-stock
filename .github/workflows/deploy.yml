name: Stock Monitor Once

on:
  schedule:
    # 每天早上8点到午夜，每5分钟运行一次 (08:00-23:59)
    - cron: '*/5 8-23 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create config file from secrets
      run: |
        cat << EOF > src/config.local.json
        {
          "api_url": "${{ secrets.API_URL }}",
          "notification_method": "${{ secrets.NOTIFICATION_METHOD || 'email' }}",
          "time_range": {
            "enable": false,
            "start_time": "08:00",
            "end_time": "23:59"
          },
          "notification_config": {
            "email": {
              "smtp_server": "${{ secrets.SMTP_SERVER }}",
              "smtp_port": ${{ secrets.SMTP_PORT }},
              "smtp_user": "${{ secrets.SMTP_USER }}",
              "smtp_password": "${{ secrets.SMTP_PASSWORD }}",
              "to_email": "${{ secrets.TO_EMAIL }}"
            }
          },
          "log_file": "product_monitor_once.log",
          "changes_log": "product_changes.log"
        }
        EOF
      
    - name: Run the stock monitor once
      run: |
        python src/product_monitor_once.py --config src/config.local.json
      env:
        PYTHONUNBUFFERED: 1
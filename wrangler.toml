# Cloudflare Pages 部署配置
# wrangler.toml - 用于Cloudflare Workers的配置

name = "watch-ricon-stock"
main = "web_api.py"
compatibility_date = "2023-10-18"

[vars]
APP_NAME = "watch-ricon-stock"
APP_VERSION = "1.0.0"

[build]
command = "pip install -r requirements.txt"

# 环境变量
[env.production]
ENVIRONMENT = "production"

[env.development]
ENVIRONMENT = "development"